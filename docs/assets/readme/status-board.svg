    <path d="M14 18 Q60 15 108 18 Q110 28 108 38 Q60 40 14 38 Q12 28 14 18 Z" style="fill:#138a6a"/>
    <text class="tag" x="24" y="32">WORKS TODAY</text>
    <text class="head" x="16" y="70">Shipped</text>
    <text class="sub" x="16" y="88">tested on every pull request</text>
    <g class="item">
      <text x="34" y="130">CLI, runtime, lifecycle</text>
      <text x="34" y="170">Discovery and parsing</text>
      <text x="34" y="210">Storage, snapshot reuse</text>
      <text x="34" y="250">Byte-identical .discovery</text>
      <text x="34" y="290">Plugin contracts</text>
    </g>
    <g fill="none" stroke="#138a6a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 125 L21 130 L28 120"/><path d="M16 165 L21 170 L28 160"/><path d="M16 205 L21 210 L28 200"/>
      <path d="M16 245 L21 250 L28 240"/><path d="M16 285 L21 290 L28 280"/>
