<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
  <title id="t">What works today, and what does not yet</title>
  <desc id="d">Four columns. Works today: CLI and runtime, discovery and parsing, storage and snapshot reuse, deterministic .discovery output, plugin contracts. Partial, with documented limits: symbols and module graphs, calls and control flow, data flow and taint, knowledge graph, Express semantics. Planned next: semantic IR, JavaScript to TypeScript migration, the Migration Readiness Assessment, the Behaviour Safety Net test generator. Target architecture: migration planning and transformation, bounded AI gateway, equivalence gates, PHP, Java and Rails.</desc>
  <style>
    .ink { fill: none; stroke: #16130f; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .head { font: 800 17px Inter, "Segoe UI", Helvetica, Arial, sans-serif; fill: #16130f; }
    .sub { font: 400 12px Inter, "Segoe UI", Helvetica, Arial, sans-serif; fill: #3d362e; }
    .item { font: 500 13.5px Inter, "Segoe UI", Helvetica, Arial, sans-serif; fill: #16130f; }
    .tag { font: 700 10.5px "JetBrains Mono", Consolas, Menlo, monospace; fill: #ffffff; letter-spacing: 0.8px; }
  </style>

  <path d="M8 6 Q480 1 952 7 Q958 200 951 394 Q480 399 9 393 Q3 200 8 6 Z" style="fill:#fff7f0" stroke="#e8d9cc" stroke-width="2"/>

  <!-- column 1: works today -->
