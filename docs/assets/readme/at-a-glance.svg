<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" role="img" aria-labelledby="t d">
  <title id="t">LegacyExodus at a glance</title>
  <desc id="d">Four measured figures at engine commit b3615d1. Ghost v6.73.0: 7,172 files and 415,492 calls in one run. Reusing Ghost's analysis: 1.0 GB, down from 11.3 GB. Tests: 2,355 passing, 0 failing. The November 8 audit: 16 of 16 findings fixed.</desc>
  <style>
    .ink { fill: none; stroke: #16130f; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .big { font: 800 40px Inter, "Segoe UI", Helvetica, Arial, sans-serif; fill: #16130f; letter-spacing: -1px; }
    .unit { font: 800 22px Inter, "Segoe UI", Helvetica, Arial, sans-serif; fill: #b24418; }
    .lab { font: 700 14px Inter, "Segoe UI", Helvetica, Arial, sans-serif; fill: #16130f; }
    .note { font: 400 12.5px Inter, "Segoe UI", Helvetica, Arial, sans-serif; fill: #3d362e; }
    .kick { font: 700 11px "JetBrains Mono", Consolas, Menlo, monospace; fill: #b24418; letter-spacing: 1px; }
    .foot { font: italic 400 12px Inter, "Segoe UI", Helvetica, Arial, sans-serif; fill: #5f5f5b; }
  </style>

  <path d="M8 6 Q480 1 952 7 Q958 125 951 244 Q480 249 9 243 Q3 125 8 6 Z" style="fill:#ececea" stroke="#d8d8d4" stroke-width="2"/>

  <!-- card 1: Ghost -->
  <g transform="translate(24 22)">
    <path class="ink" d="M2 4 Q105 0 208 3 Q212 90 209 180 Q105 184 3 181 Q-1 90 2 4 Z" style="fill:#fff7f0"/>
    <text class="kick" x="18" y="30">WHOLE REPOSITORY</text>
    <text class="big" x="16" y="78">7,172</text>
    <text class="lab" x="18" y="104">files of Ghost in one run</text>
    <text class="note" x="18" y="128">415,492 calls mapped,</text>
    <text class="note" x="18" y="145">every file accounted for</text>
    <path class="ink" d="M18 160 Q100 156 190 161" stroke="#b24418" stroke-width="3"/>
  </g>

  <!-- card 2: reuse -->
  <g transform="translate(256 22)">
    <path class="ink" d="M3 3 Q105 0 207 4 Q211 90 208 181 Q105 184 2 180 Q-2 90 3 3 Z" style="fill:#fff7f0"/>
    <text class="kick" x="18" y="30">BOUNDED MEMORY</text>
    <text class="big" x="16" y="78">1.0</text><text class="unit" x="82" y="78">GB</text>
    <text class="lab" x="18" y="104">to reuse Ghost's analysis</text>
    <text class="note" x="18" y="128">was 11.3 GB and 79 s;</text>
    <text class="note" x="18" y="145">now about 25 s</text>
    <!-- before/after bars -->
    <path d="M18 158 L190 158" stroke="#a3a39f" stroke-width="6" stroke-linecap="round"/>
    <path d="M18 168 L34 168" stroke="#b24418" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- card 3: tests -->
  <g transform="translate(488 22)">
    <path class="ink" d="M2 4 Q105 1 208 3 Q212 90 208 180 Q105 184 3 181 Q-1 90 2 4 Z" style="fill:#fff7f0"/>
    <text class="kick" x="18" y="30">TESTED</text>
    <text class="big" x="16" y="78">2,355</text>
    <text class="lab" x="18" y="104">tests passing, 0 failing</text>
    <text class="note" x="18" y="128">22,411 assertions</text>
    <text class="note" x="18" y="145">in 198 test files</text>
    <g transform="translate(160 140)">
      <path d="M0 12 Q1 0 13 0 Q26 1 26 13 Q25 25 13 26 Q1 25 0 12 Z" style="fill:#138a6a" stroke="#16130f" stroke-width="1.5"/>
      <path d="M7 13 L11 17 L19 8" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- card 4: audit -->
  <g transform="translate(720 22)">
    <path class="ink" d="M3 3 Q105 0 206 4 Q210 90 207 181 Q105 184 2 180 Q-2 90 3 3 Z" style="fill:#fff7f0"/>
    <text class="kick" x="18" y="30">AUDITED</text>
    <text class="big" x="16" y="78">16</text><text class="unit" x="66" y="78">/ 16</text>
    <text class="lab" x="18" y="104">Nov 8 audit findings fixed</text>
    <text class="note" x="18" y="128">each merged after a fact</text>
    <text class="note" x="18" y="145">diff showed no fact lost</text>
    <g fill="#2d5ba8">
      <circle cx="22" cy="164" r="3.5"/><circle cx="33" cy="164" r="3.5"/><circle cx="44" cy="164" r="3.5"/><circle cx="55" cy="164" r="3.5"/>
      <circle cx="66" cy="164" r="3.5"/><circle cx="77" cy="164" r="3.5"/><circle cx="88" cy="164" r="3.5"/><circle cx="99" cy="164" r="3.5"/>
      <circle cx="110" cy="164" r="3.5"/><circle cx="121" cy="164" r="3.5"/><circle cx="132" cy="164" r="3.5"/><circle cx="143" cy="164" r="3.5"/>
      <circle cx="154" cy="164" r="3.5"/><circle cx="165" cy="164" r="3.5"/><circle cx="176" cy="164" r="3.5"/><circle cx="187" cy="164" r="3.5"/>
    </g>
  </g>

  <text class="foot" x="26" y="232">Engine b3615d1, one 16 GB Windows machine, 2026-11-08 and 09. Commands and sources: see "Measured, not claimed" below.</text>
</svg>
