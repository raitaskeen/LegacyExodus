name: Documentation

on:
  push:
    branches:
      - main
      - docs-foundation
    paths:
      - 'docs/**'
      - '*.md'
      - '.agents/**'
      - '.github/**'
  pull_request:
    paths:
      - 'docs/**'
      - '*.md'
      - '.agents/**'
      - '.github/**'

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-docs:
    name: Documentation Hygiene & Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Git Diff Cleanliness
        run: git diff --check
