name: Documentation

on:
  push:
    branches:
      - main
      - docs-foundation
    paths:
      - 'docs/**'
      - '*.md'
      - '.agents/**'
      - '.github/**'
  pull_request:
    paths:
      - 'docs/**'
      - '*.md'
      - '.agents/**'
      - '.github/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-docs:
    name: Documentation Hygiene & Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify Git Diff Cleanliness
        run: git diff --check
