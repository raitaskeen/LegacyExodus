name: Dependabot Bun Lockfile Synchronization

on:
  pull_request_target:
    types: [opened, synchronize]
    paths:
      - 'legacy-exodus-core/package.json'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-lockfile:
    name: Sync Bun Lockfile
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: legacy-exodus-core

    steps:
      - name: Checkout Dependabot PR Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Regenerate Bun Lockfile
        run: bun install

      - name: Commit and Push Updated Lockfile
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): synchronize bun.lock"
            git push
          fi
