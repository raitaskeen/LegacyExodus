name: CI

on:
  push:
    branches:
      - main
      - core-foundation
  pull_request:
    branches:
      - main
      - core-foundation
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify Core
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: legacy-exodus-core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Benchmark Governance Audit
        run: bun run benchmark audit

      - name: CLI smoke test
        run: bun run src/cli/index.ts --help

      - name: Git diff check
        run: git diff --check
