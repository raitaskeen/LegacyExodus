name: CI

on:
  push:
    branches:
      - main
      - core-foundation
  pull_request:
    branches:
      - main
      - core-foundation
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify Core
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: legacy-exodus-core

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Benchmark Governance Audit
        run: bun run benchmark audit

      - name: CLI smoke test
        run: bun run src/cli/index.ts --help

      - name: Git diff check
        run: git diff --check

  windows-smoke:
    name: Windows Path Smoke
    runs-on: windows-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: legacy-exodus-core

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run focused Windows path tests
        run: bun test tests/unit/graph/windows-drive-canonicalization.test.ts tests/unit/module-resolver.test.ts tests/unit/orchestration/lookup-map-canonicalization.test.ts
