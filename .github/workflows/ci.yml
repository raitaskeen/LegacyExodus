name: CI

on:
  push:
    branches:
      - main
      - phase-2.8-hardening
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Core
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: legacy-exodus-core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Git diff check
        run: git diff --check