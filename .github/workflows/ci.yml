name: CI

on:
  push:
    branches:
      - main
      - core-foundation
  pull_request:
    branches:
      - main
      - core-foundation
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify Core
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: legacy-exodus-core

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Benchmark Governance Audit
        run: bun run benchmark audit

      - name: CLI smoke test
        run: bun run src/cli/index.ts --help

      - name: Git diff check
        run: git diff --check

  windows-smoke:
    name: Windows Path Smoke
    runs-on: windows-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: legacy-exodus-core

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run focused Windows path tests
        run: bun test tests/unit/graph/windows-drive-canonicalization.test.ts tests/unit/module-resolver.test.ts tests/unit/orchestration/lookup-map-canonicalization.test.ts

  # Informational: reports which analysis facts a pull request loses and gains
  # compared with its base. It never fails on lost facts (no --fail-on-loss);
  # it fails only if the comparison tool itself errors.
  fact-diff:
    name: Fact Diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: head/legacy-exodus-core

    steps:
      - name: Checkout head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: head
          persist-credentials: false

      - name: Checkout base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install head dependencies
        run: bun install --frozen-lockfile

      - name: Install base dependencies
        working-directory: base/legacy-exodus-core
        run: bun install --frozen-lockfile

      - name: Diff analysis facts (base vs head)
        # The corpus is taken from the base checkout so both engines analyze identical input.
        run: >-
          bun run benchmarks/cli.ts fact-diff
          --base ../../base/legacy-exodus-core
          --head .
          ../../base/legacy-exodus-core/benchmarks/fixtures/governance-audit
          ../../base/legacy-exodus-core/src
          --output fact-diff.md

      - name: Publish fact diff to job summary
        run: cat fact-diff.md >> "$GITHUB_STEP_SUMMARY"
